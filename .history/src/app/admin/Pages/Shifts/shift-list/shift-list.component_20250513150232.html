<div class="filter-container" style="margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem;">
  <p-calendar [(ngModel)]="dateRange" selectionMode="range" dateFormat="dd/mm/yy" showIcon="true" placeholder="Select Date Range"
    [readonlyInput]="true" class="custom-calendar" inputId="dateRangePicker"></p-calendar>
  
  <div class="button-container" style="display: flex; gap: 0.5rem;">
    <button pButton type="button" label="Filter" class="p-button-primary" (click)="filterByDateRange()"></button>
    <button pButton type="button" label="Reset" class="p-button-secondary" (click)="resetFilter()"></button>
  </div>
</div>



<p-table [value]="paginatedShifts" [paginator]="true" [rows]="rows" [totalRecords]="totalRecords"
  (onLazyLoad)="loadShifts($event)" [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th>From</th>
      <th>To</th>
      <th>Day Date</th>
      <th>Appoint Count</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-shift>
    <!-- {{shift|json}} -->
    <tr>
      <!-- <td>{{ shift.id }}</td> -->
      <td>{{ shift.from }}</td>
      <td>{{ shift.to }}</td>
      <td>{{ shift.dayDate | date:'d MMMM yyyy'}}</td>
      <td>{{ shift.appointmentNumber}}</td>
      <td class="menu-container">
        <button mat-button [matMenuTriggerFor]="menu" class="p-button p-button-rounded p-button-primary">
          Actions
        </button>
        <mat-menu #menu="matMenu" class="custom-menu">
          <button mat-menu-item class="p-menuitem-link" (click)="openShiftDetails(shift.id)">
            <i class="pi pi-pencil"></i> Details
          </button>
        </mat-menu>
      </td>
    </tr>
  </ng-template>
</p-table>
