<aside class="main-sidebar sidebar-dark-primary elevation-4">
  <!-- Brand Logo -->
  <a href="index3.html" class="brand-link">
    <img src="assets/img/AdminLTELogo.png" alt="AdminLTE Logo" class="brand-image img-circle elevation-3"
      style="opacity: 0.8" />
    <span class="brand-text font-weight-light">Clinical MS</span>
  </a>

  <!-- Sidebar -->
  <div class="sidebar">
    <!-- Sidebar user panel (optional) -->
    <div class="user-panel mt-3 pb-3 mb-3 d-flex">
      <div class="image">
        <img src="assets/img/user2-160x160.jpg" class="img-circle elevation-2" alt="User Image" />
      </div>
      <div class="info" *ngIf="user">
        <a href="#" class="d-block cut-text">{{ user.firstName }}</a>
      </div>
    </div>

    <!-- Sidebar Menu -->
    <nav class="mt-2">
      <ul class="nav nav-pills nav-sidebar flex-column" role="menu">
        <li class="nav-item" [ngClass]="{ 'menu-open': item.expanded }" *ngFor="let item of menuItems">
          <a class="nav-link" (click)="toggleMenu(item)">
            <i class="nav-icon" [ngClass]="item.icon"></i>
            <p>
              {{ item.name }}
              <i class="right fas" [ngClass]="item.expanded ? 'fa-angle-left' : 'fa-angle-down'"></i>
            </p>
          </a>
          <ul class="nav nav-treeview" [@expandCollapse]="item.expanded ? 'expanded' : 'collapsed'">
            <li class="nav-item" *ngFor="let subItem of item.children">
              <a class="nav-link" [routerLink]="subItem?.link"
                [ngClass]="{ active: router.url.includes(subItem.link) }">
                <i [ngClass]="subItem.icon" class="text-primary"> </i>
                <p class="pl-2"> {{ subItem?.name }}</p>
              </a>
            </li>
          </ul>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" (click)="logOut()">
            <i class="nav-icon fas fa-sign-out-alt"></i>
            <p>Log Out</p>
          </a>
        </li>
      </ul>
    </nav>
    <!-- /.sidebar-menu -->
  </div>
  <!-- /.sidebar -->
</aside>
